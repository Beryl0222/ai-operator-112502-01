[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "operator_paged_attention"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
paged-attention-demo = "operator_paged_attention.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
